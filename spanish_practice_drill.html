    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'spanish-drill-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo", authDomain: "demo.firebaseapp.com", projectId: "demo"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentRoomId = null;
        let unsubscribeRoom = null;
        let playerRole = null; // 'p1' or 'p2'

        // Authenticate user anonymously or with token
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const res = await signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = res.user;
                } else {
                    const res = await signInAnonymously(auth);
                    currentUser = res.user;
                }
            } catch (e) {
                console.error("Auth error:", e);
            }
        }
        initAuth();

        // Generate 4-letter room code
        function generateCode() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ";
            let code = "";
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        window.createRoom = async function() {
            if (!currentUser) await initAuth();
            const code = generateCode();
            currentRoomId = code;
            playerRole = 'p1';

            const firstQuestion = getRandomVsQuestion();

            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
            await setDoc(roomRef, {
                p1Id: currentUser.uid,
                p2Id: null,
                p1Score: 0,
                p2Score: 0,
                status: 'waiting',
                currentQuestion: firstQuestion,
                roundWinner: null,
                createdAt: Date.now()
            });

            setupRoomListener(code);
            showVsGameplay(code);
        };

        window.joinRoom = async function() {
            if (!currentUser) await initAuth();
            const inputCode = document.getElementById('room-code-input').value.trim().toUpperCase();
            if (!inputCode) return alert("Por favor escribe un código de sala.");

            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', inputCode);
            const snap = await getDoc(roomRef);

            if (!snap.exists()) {
                return alert("No se encontró esa sala. Verifica el código.");
            }

            const data = snap.data();
            if (data.p2Id && data.p2Id !== currentUser.uid) {
                return alert("La sala ya está llena.");
            }

            playerRole = data.p1Id === currentUser.uid ? 'p1' : 'p2';
            currentRoomId = inputCode;

            if (playerRole === 'p2') {
                await updateDoc(roomRef, { p2Id: currentUser.uid, status: 'playing' });
            }

            setupRoomListener(inputCode);
            showVsGameplay(inputCode);
        };

        function getRandomVsQuestion() {
            const q = vocabData[Math.floor(Math.random() * vocabData.length)];
            let options = [q.en];
            while (options.length < 4) {
                let randomOpt = vocabData[Math.floor(Math.random() * vocabData.length)].en;
                if (!options.includes(randomOpt)) options.push(randomOpt);
            }
            options.sort(() => Math.random() - 0.5);
            return { es: q.es, en: q.en, cat: q.cat, options };
        }

        function setupRoomListener(code) {
            if (unsubscribeRoom) unsubscribeRoom();
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);

            unsubscribeRoom = onSnapshot(roomRef, (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();

                document.getElementById('p1-score').textContent = data.p1Score || 0;
                document.getElementById('p2-score').textContent = data.p2Score || 0;

                const statusEl = document.getElementById('vs-status');
                if (data.status === 'waiting') {
                    statusEl.textContent = "Esperando al Jugador 2... ⏳";
                    statusEl.className = "text-xs font-bold text-amber-500 animate-pulse";
                } else {
                    statusEl.textContent = "¡Partida en vivo! 🔥";
                    statusEl.className = "text-xs font-bold text-green-500";
                }

                if (data.currentQuestion) {
                    renderVsQuestion(data.currentQuestion, data);
                }
            }, (err) => console.error("Firestore room listener error:", err));
        }

        function renderVsQuestion(q, roomData) {
            document.getElementById('vs-category').textContent = q.cat;
            document.getElementById('vs-question').textContent = `¿Qué significa "${q.es}"?`;

            const container = document.getElementById('vs-options');
            container.innerHTML = '';
            
            const feedbackEl = document.getElementById('vs-feedback');
            feedbackEl.textContent = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "p-4 border-2 border-purple-100 bg-white hover:bg-purple-50 rounded-2xl font-bold text-gray-700 text-sm shadow-sm transition-all";
                btn.textContent = opt;
                btn.onclick = () => submitVsAnswer(opt, q, roomData);
                container.appendChild(btn);
            });
        }

        async function submitVsAnswer(selectedOpt, question, roomData) {
            if (selectedOpt === question.en) {
                playHooraySound();
                triggerConfetti();

                const newP1Score = playerRole === 'p1' ? (roomData.p1Score || 0) + 1 : roomData.p1Score;
                const newP2Score = playerRole === 'p2' ? (roomData.p2Score || 0) + 1 : roomData.p2Score;

                const nextQuestion = getRandomVsQuestion();

                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
                await updateDoc(roomRef, {
                    p1Score: newP1Score,
                    p2Score: newP2Score,
                    currentQuestion: nextQuestion,
                    lastWinner: playerRole
                });
            } else {
                const feedbackEl = document.getElementById('vs-feedback');
                feedbackEl.className = "text-center font-bold text-sm text-red-500";
                feedbackEl.textContent = "❌ ¡Incorrecto! Inténtalo de nuevo.";
            }
        }

        function showVsGameplay(code) {
            document.getElementById('vs-lobby').classList.add('hidden');
            document.getElementById('vs-gameplay').classList.remove('hidden');
            document.getElementById('current-room-code').textContent = code;
        }

        window.leaveRoom = function() {
            if (unsubscribeRoom) unsubscribeRoom();
            currentRoomId = null;
            document.getElementById('vs-lobby').classList.remove('hidden');
            document.getElementById('vs-gameplay').classList.add('hidden');
        };
    </script>
